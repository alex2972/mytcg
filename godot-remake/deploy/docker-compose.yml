# Game server behind Caddy (automatic HTTPS certificates, wss:// for clients).
# 1. Point a DNS name (e.g. play.example.com) at the machine and put it in deploy/Caddyfile.
# 2. From the project root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - game-data:/data              # accounts, matches, logs, backups, config.json
    expose:
      - "9080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
volumes:
  game-data:
  caddy-data:
